<!DOCTYPE html>
<html>
<head>
  <title>Cloud Monitor — AI Insights</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="/static/style.css">

  <style>
    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(150% 120% at top,#1a1a38,#05050a);
      color:#f1f3ff;
      font-family:Inter,system-ui;
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }

    .wrap{
      width:100%;
      max-width:960px;
      margin:40px 16px;
      padding:24px 22px 26px;
      background:linear-gradient(180deg,#141432,#0e0e22);
      border-radius:20px;
      border:1px solid rgba(255,255,255,.12);
      box-shadow:0 14px 32px rgba(0,0,0,.55);
      animation:fadeUp .7s ease both;
    }

    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

    h1{margin:6px 0 6px;font-size:1.9rem}
    p{color:#a9aecf;line-height:1.6}

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
      margin-top:16px;
    }

    label{
      font-size:.85rem;
      color:#bcc1e0;
      display:block;
      margin-bottom:6px;
    }

    select,button{
      width:100%;
      padding:11px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.14);
      background:#1b1b36;
      color:#f1f3ff;
      font-size:.95rem;
      outline:none;
    }

    select:focus{
      border-color:rgba(134,86,255,.6);
    }

    button{
      margin-top:10px;
      background:linear-gradient(135deg,#8656ff,#4ab3ff);
      font-weight:700;
      cursor:pointer;
      box-shadow:0 14px 30px rgba(120,80,255,.3);
      transition:.25s;
    }

    button:hover{
      transform:translateY(-2px);
      opacity:.97;
    }

    #output{
      margin-top:22px;
      padding:18px;
      border-radius:16px;
      background:#0f0f23;
      border:1px solid rgba(255,255,255,.10);
      min-height:130px;
      white-space:pre-wrap;
      line-height:1.55;
      color:#d6d9ff;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.03);
      animation:fadeUp .7s ease both;
    }

    .back{
      display:inline-block;
      margin-bottom:14px;
      font-size:.9rem;
      color:#9fb3ff;
      text-decoration:none;
      transition:.25s;
    }
    .back:hover{color:#cfd8ff}
  </style>
</head>

<body>

<div class="wrap">

  <a href="/dashboard" class="back">← Back to Dashboard</a>

  <h1>AI System Insights</h1>
  <p>
    Select a device and time window — the AI will analyze performance,
    detect risks, and recommend improvements.
  </p>

  <div class="row">
    <div>
      <label>Device</label>
      <select id="deviceSelect"></select>
    </div>

    <div>
      <label>Time Range</label>
      <select id="rangeSelect">
        <option value="30">Last 30 minutes</option>
        <option value="60">Last 1 hour</option>
        <option value="180">Last 3 hours</option>
        <option value="1440">Last 24 hours</option>
      </select>
    </div>
  </div>

  <button onclick="generateInsights()">Generate Insights</button>

  <div id="output">AI results will appear here…</div>
</div>

<script src="/static/insight.js"></script>

</body>
</html>
